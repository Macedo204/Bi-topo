<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<title>Minha Revista</title>
<style>
  body {
    margin: 0;
    background: #2b2b2b;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: Arial, sans-serif;
  }
  #viewer {
    position: relative;
    width: 1000px;
    max-width: 95vw;
    height: 700px;
    background: #fff;
    box-shadow: 0 10px 40px rgba(0,0,0,0.5);
    display: none;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  #viewer img {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
    opacity: 1;
    transition: opacity 0.25s ease, transform 0.25s ease;
  }
  #viewer img.flipping {
    opacity: 0;
    transform: scaleX(0.92);
  }
  #controls {
    margin-top: 15px;
    display: none;
    align-items: center;
    gap: 15px;
  }
  button {
    padding: 8px 16px;
    cursor: pointer;
    border: none;
    border-radius: 4px;
    background: #444;
    color: white;
    font-size: 14px;
  }
  button:hover:not(:disabled) { background: #666; }
  button:disabled { background: #222; cursor: not-allowed; opacity: 0.5; }
  #page-info { color: #ccc; font-size: 14px; }
  #loading { color: #ccc; margin-top: 10px; font-size: 16px; }
</style>
</head>
<body>

<div id="loading">Carregando revista...</div>

<div id="viewer">
  <img id="page-img" alt="Página(s) da revista">
</div>

<div id="controls">
  <button id="prev">⟨ Anterior</button>
  <span id="page-info">Página 1 de 1</span>
  <button id="next">Próxima ⟩</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
pdfjsLib.GlobalWorkerOptions.workerSrc =
  'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

const PDF_FILENAME = 'revista.pdf';

let spreadImages = []; // uma imagem (dataURL) já pronta por spread
let currentSpread = 0;
let pageRangeLabels = [];

const viewer = document.getElementById('viewer');
const img = document.getElementById('page-img');
const controls = document.getElementById('controls');
const pageInfo = document.getElementById('page-info');
const prevBtn = document.getElementById('prev');
const nextBtn = document.getElementById('next');
const loading = document.getElementById('loading');

async function carregarRevista() {
  try {
    const pdf = await pdfjsLib.getDocument(PDF_FILENAME).promise;

    // Primeiro renderiza cada página individualmente para canvases
    const pageCanvases = [];
    for (let i = 1; i <= pdf.numPages; i++) {
      loading.textContent = `Processando página ${i} de ${pdf.numPages}...`;
      const page = await pdf.getPage(i);
      const viewport = page.getViewport({ scale: 1.5 });
      const canvas = document.createElement('canvas');
      canvas.width = viewport.width;
      canvas.height = viewport.height;
      const context = canvas.getContext('2d');
      await page.render({ canvasContext: context, viewport }).promise;
      pageCanvases.push(canvas);
    }

    loading.textContent = 'Montando as páginas...';

    // Agrupa em spreads: capa sozinha, depois pares (2-3, 4-5...)
    const groups = [];
    groups.push([0]);
    for (let i = 1; i < pageCanvases.length; i += 2) {
      if (i + 1 < pageCanvases.length) {
        groups.push([i, i + 1]);
      } else {
        groups.push([i]);
      }
    }

    // Para cada grupo, desenha numa ÚNICA imagem combinada
    spreadImages = groups.map((group) => {
      if (group.length === 1) {
        const c = pageCanvases[group[0]];
        return c.toDataURL('image/jpeg', 0.92);
      }
      const c1 = pageCanvases[group[0]];
      const c2 = pageCanvases[group[1]];
      const h = Math.max(c1.height, c2.height);
      const combined = document.createElement('canvas');
      combined.width = c1.width + c2.width;
      combined.height = h;
      const ctx = combined.getContext('2d');
      ctx.fillStyle = '#fff';
      ctx.fillRect(0, 0, combined.width, combined.height);
      ctx.drawImage(c1, 0, 0);
      ctx.drawImage(c2, c1.width, 0);
      return combined.toDataURL('image/jpeg', 0.92);
    });

    pageRangeLabels = groups.map((group) =>
      group.length === 1
        ? `Página ${group[0] + 1} de ${pageCanvases.length}`
        : `Páginas ${group[0] + 1}-${group[1] + 1} de ${pageCanvases.length}`
    );

    loading.style.display = 'none';
    currentSpread = 0;
    showSpread(currentSpread);
    viewer.style.display = 'flex';
    controls.style.display = 'flex';

  } catch (err) {
    console.error('Erro ao processar PDF:', err);
    loading.textContent = 'Erro ao carregar a revista. Verifique se "revista.pdf" está na mesma pasta.';
  }
}

function showSpread(index) {
  img.classList.add('flipping');
  setTimeout(() => {
    img.src = spreadImages[index];
    img.classList.remove('flipping');
  }, 200);

  pageInfo.textContent = pageRangeLabels[index];
  prevBtn.disabled = index === 0;
  nextBtn.disabled = index === spreadImages.length - 1;
}

prevBtn.addEventListener('click', () => {
  if (currentSpread > 0) {
    currentSpread--;
    showSpread(currentSpread);
  }
});

nextBtn.addEventListener('click', () => {
  if (currentSpread < spreadImages.length - 1) {
    currentSpread++;
    showSpread(currentSpread);
  }
});

document.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowLeft') prevBtn.click();
  if (e.key === 'ArrowRight') nextBtn.click();
});

carregarRevista();
</script>

</body>
</html>
