<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<title>Minha Revista</title>
<style>
  body {
    margin: 0;
    background: transparent;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: Arial, sans-serif;
  }
  #viewer {
    position: relative;
    height: 700px;
    max-width: 95vw;
    background: #fff;
    display: none;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    transition: width 0.25s ease;
  }
  #viewer img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
    opacity: 1;
    transition: opacity 0.25s ease, transform 0.25s ease;
  }
  #viewer img.flipping {
    opacity: 0;
    transform: scaleX(0.92);
  }
  #controls {
    margin-top: 15px;
    display: none;
    align-items: center;
    gap: 15px;
  }
  button {
    padding: 8px 16px;
    cursor: pointer;
    border: none;
    border-radius: 4px;
    background: #444;
    color: white;
    font-size: 14px;
  }
  button:hover:not(:disabled) { background: #666; }
  button:disabled { background: #222; cursor: not-allowed; opacity: 0.5; }
  #page-info { color: #555; font-size: 14px; }
  #loading { color: #555; margin-top: 10px; font-size: 16px; }
</style>
</head>
<body>

<div id="loading">Carregando revista...</div>

<div id="viewer">
  <img id="page-img" alt="Página(s) da revista">
</div>

<div id="controls">
  <button id="prev">⟨ Anterior</button>
  <span id="page-info">Página 1 de 1</span>
  <button id="next">Próxima ⟩</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
pdfjsLib.GlobalWorkerOptions.workerSrc =
  'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

const PDF_FILENAME = 'revista.pdf';
const VIEWER_HEIGHT = 700; // deve bater com o CSS #viewer height

let spreadImages = [];
let spreadRatios = [];   // largura/altura de cada spread, para dimensionar o #viewer
let pageRangeLabels = [];
let currentSpread = 0;
let totalGroups = 0;

const viewer = document.getElementById('viewer');
const img = document.getElementById('page-img');
const controls = document.getElementById('controls');
const pageInfo = document.getElementById('page-info');
const prevBtn = document.getElementById('prev');
const nextBtn = document.getElementById('next');
const loading = document.getElementById('loading');

async function carregarRevista() {
  try {
    const pdf = await pdfjsLib.getDocument(PDF_FILENAME).promise;
    const totalPages = pdf.numPages;

    const groups = [];
    groups.push([0]);
    for (let i = 1; i < totalPages; i += 2) {
      if (i + 1 < totalPages) groups.push([i, i + 1]);
      else groups.push([i]);
    }
    totalGroups = groups.length;
    spreadImages = new Array(totalGroups).fill(null);
    spreadRatios = new Array(totalGroups).fill(1);
    pageRangeLabels = groups.map((g) =>
      g.length === 1
        ? `Página ${g[0] + 1} de ${totalPages}`
        : `Páginas ${g[0] + 1}-${g[g.length - 1] + 1} de ${totalPages}`
    );

    let jaMostrouAlgumaCoisa = false;

    for (let gi = 0; gi < groups.length; gi++) {
      const group = groups[gi];
      const canvases = [];

      for (const pageIndex of group) {
        const page = await pdf.getPage(pageIndex + 1);
        const viewport = page.getViewport({ scale: 1.5 });
        const canvas = document.createElement('canvas');
        canvas.width = viewport.width;
        canvas.height = viewport.height;
        const context = canvas.getContext('2d');
        await page.render({ canvasContext: context, viewport }).promise;
        canvases.push(canvas);
      }

      let dataUrl, ratio;
      if (canvases.length === 1) {
        const c = canvases[0];
        dataUrl = c.toDataURL('image/jpeg', 0.92);
        ratio = c.width / c.height;
      } else {
        const c1 = canvases[0], c2 = canvases[1];
        const h = Math.max(c1.height, c2.height);
        const combined = document.createElement('canvas');
        combined.width = c1.width + c2.width;
        combined.height = h;
        const ctx = combined.getContext('2d');
        ctx.fillStyle = '#fff';
        ctx.fillRect(0, 0, combined.width, combined.height);
        ctx.drawImage(c1, 0, 0);
        ctx.drawImage(c2, c1.width, 0);
        dataUrl = combined.toDataURL('image/jpeg', 0.92);
        ratio = combined.width / combined.height;
      }

      spreadImages[gi] = dataUrl;
      spreadRatios[gi] = ratio;

      if (!jaMostrouAlgumaCoisa) {
        jaMostrouAlgumaCoisa = true;
        loading.style.display = 'none';
        viewer.style.display = 'flex';
        controls.style.display = 'flex';
        currentSpread = 0;
        showSpread(0);
      } else {
        atualizarBotoes();
      }
    }
  } catch (err) {
    console.error('Erro ao processar PDF:', err);
    loading.textContent = 'Erro ao carregar a revista. Verifique se "revista.pdf" está na mesma pasta.';
  }
}

function showSpread(index) {
  if (!spreadImages[index]) return;

  // Ajusta a largura do viewer conforme a proporção da imagem,
  // eliminando o retângulo branco nas páginas únicas
  viewer.style.width = (VIEWER_HEIGHT * spreadRatios[index]) + 'px';

  img.classList.add('flipping');
  setTimeout(() => {
    img.src = spreadImages[index];
    img.classList.remove('flipping');
  }, 200);
  pageInfo.textContent = pageRangeLabels[index];
  atualizarBotoes();
}

function atualizarBotoes() {
  prevBtn.disabled = currentSpread === 0;
  const proximaPronta = spreadImages[currentSpread + 1] != null;
  nextBtn.disabled = currentSpread >= totalGroups - 1 || !proximaPronta;
}

prevBtn.addEventListener('click', () => {
  if (currentSpread > 0) {
    currentSpread--;
    showSpread(currentSpread);
  }
});

nextBtn.addEventListener('click', () => {
  if (currentSpread < totalGroups - 1 && spreadImages[currentSpread + 1]) {
    currentSpread++;
    showSpread(currentSpread);
  }
});

document.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowLeft') prevBtn.click();
  if (e.key === 'ArrowRight') nextBtn.click();
});

carregarRevista();
</script>

</body>
</html>
